<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="wasm_exec.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        });
    </script>
    <div id="toolbar">
        <div class="dropdown">
            <button class="dropbtn">Markup ▼</button>
            <div class="dropdown-content">
                <button onclick="insertMedia('image')">Insert Image</button>
                <button onclick="insertMedia('video')">Insert Video</button>
                <button onclick="openTableModal()">Create Table</button>
                <button onclick="openColorModal()">Text Color</button>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">Save ▼</button>
            <div class="dropdown-content">
                <button onclick="downloadFile('md')">Save Markdown</button>
                <button onclick="downloadFile('html')">Save HTML</button>
            </div>
        </div>
    </div>
    <div id="container">
        <textarea id="input" oninput="updateOutput()" placeholder="Type markdown here..."></textarea>
        <div id="output"></div>
    </div>
    
    <!-- Modals -->
    <div id="table-modal" class="modal">
        <h3>Create Table</h3>
        Rows: <input type="number" id="table-rows" value="2" min="1">
        Cols: <input type="number" id="table-cols" value="2" min="1">
        <button onclick="generateTable()">Insert Table</button>
        <button onclick="closeTableModal()">Cancel</button>
    </div>
    
    <!-- Color Modal -->
    <div id="color-modal" class="modal">
        <h3>Text Color</h3>
        Text: <input type="text" id="color-text" placeholder="Your text here">
        Color: <input type="color" id="text-color" value="#ff0000">
        <button onclick="applyColor()">Apply Color</button>
        <button onclick="closeColorModal()">Cancel</button>
    </div>
    
    <div id="modal" class="modal">
        <h3 id="modal-title">Insert Media</h3>
        <input type="text" id="media-url" placeholder="URL">
        <input type="text" id="media-desc" placeholder="Description">
        <div id="media-options">
            <div id="image-options" style="display:none;">
                <select id="img-align"><option value="">Align (Default)</option><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
                <input type="number" id="img-scale" placeholder="Width (px)" min="50" max="1000">
            </div>
            <div id="video-options" style="display:none;">
                Height (px): <input type="number" id="vid-height" placeholder="Height (px)" value="200" min="50" max="1000">
            </div>
        </div>
        <button onclick="applyMedia()">Insert</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</body>
</html>
